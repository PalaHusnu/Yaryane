 .day.today-mark:not(.selected){outline:1px solid var(--accent);outline-offset:-2px;font-weight:750}</style></head><body><div class="app" id="app"></div><nav class="nav" id="nav"></nav><div id="modal"></div><script>
const K='yaryane_v1_events',TK='yaryane_tasks_v1',NK='yaryane_notes_v1',SK='yaryane_shifts_v1',THEME='yaryane_theme';
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let events=get(K,[]),tasks=get(TK,[]),notes=get(NK,[]),shifts=get(SK,[]),page='home',selected=localDate(new Date()),month=new Date().getMonth(),year=new Date().getFullYear(),filter='Alle',shiftMode='Monat',edit=null;
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
const days=['Mo','Di','Mi','Do','Fr','Sa','So'],types={early:['F','Frühdienst','#2dc49b'],late:['S','Spätdienst','#8c70f6'],night:['N','Nachtdienst','#f5b13f'],free:['F','Frei','#4ba8ea'],vacation:['U','Urlaub','#ef79a2'],sick:['K','Krankheit','#fa637b']};
let theme=localStorage.getItem(THEME)|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t);document.querySelector('meta[name=theme-color]').content=t==='dark'?'#061225':'#dce9ff'}setTheme(theme);
function navigate(p){page=p;render();window.scrollTo(0,0)}
function nav(){let arr=[['home','⌂','Heute'],['calendar','▦','Kalender'],['tasks','✓','Aufgaben'],['shifts','▣','Dienstplan'],['more','⚙','Mehr']];document.getElementById('nav').innerHTML=arr.map(([id,i,t])=>'<button class="'+(page===id||page==='notes'&&id==='more'?'active':'')+'" onclick="navigate(\''+id+'\')"><span class="symbol">'+i+'</span>'+t+'</button>').join('')}
function head(title,plus){return '<div class="toolbar"><h2>'+title+'</h2><div class="actions">'+(plus?'<button class="add" aria-label="Hinzufügen" onclick="openForm(\''+plus+'\')">+</button>':'')+'</div></div>'}
function eventList(date){let e=events.filter(x=>x.date===date).sort((a,b)=>(a.start||'').localeCompare(b.start||''));return e.length?e.map(x=>'<div class="glass item stripe" style="border-left-color:'+(x.kind==='work'?'#0c86ff':x.kind==='free'?'#2dc49b':'#fa659c')+'"><span class="time">'+esc(x.start||'Ganztägig')+'</span><span class="iconbox">'+(x.kind==='work'?'💼':x.kind==='free'?'🌿':'📅')+'</span><div class="details"><strong>'+esc(x.name)+'</strong><small>'+esc(x.notes||x.end||'Termin')+'</small></div><button class="dots" onclick="openForm(\'event\',\''+esc(x.id)+'\')">•••</button></div>').join(''):'<div class="glass empty">Noch keine Termine für diesen Tag. ✨</div>'}
function home(){let today=localDate(new Date());return '<div class="top"><div><div class="brand">🪷 Yary<span>ane</span> ✦</div><div class="subtitle">Dein Kalender. Dein Leben.</div></div><button class="avatar" onclick="navigate(\'more\')">●</button></div><section class="glass hero"><h1>Yaryane ☾</h1><p>Dein Kalender. Dein Leben.</p><button onclick="openForm(\'event\')">Neuen Termin hinzufügen… <b>+</b></button></section><div class="sectionhead"><h2>Heute</h2><button onclick="navigate(\'calendar\')">Alle anzeigen ›</button></div><div class="muted">'+fmt(today)+'</div>'+eventList(today)+'<div class="sectionhead"><h2>Deine Aufgaben</h2><button onclick="navigate(\'tasks\')">Alle anzeigen ›</button></div>'+taskList(tasks.filter(x=>!x.done).slice(0,3))+'<div class="sectionhead"><h2>Schnellzugriff</h2></div><div class="notes"><button class="glass note" onclick="navigate(\'shifts\')"><strong>▣ Dienstplan</strong><p>Deine Schichten im Blick</p></button><button class="glass note" onclick="navigate(\'notes\')"><strong>▤ Notizen</strong><p>Ideen und Listen festhalten</p></button></div>'}
function calGrid(forShifts){let first=new Date(year,month,1),offset=(first.getDay()+6)%7,last=new Date(year,month+1,0).getDate(),total=Math.ceil((offset+last)/7)*7,out='<div class="glass calendar"><div class="weekdays">'+days.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">';for(let i=0;i<total;i++){let d=new Date(year,month,i-offset+1),date=localDate(d),sh=shifts.find(x=>x.date===date),ev=events.filter(x=>x.date===date),other=d.getMonth()!==month,today=date===localDate(new Date());out+='<button aria-label="'+fmt(date)+(ev.length?', '+ev.length+' Termine':'')+'" class="day '+(other?'other ':'')+(selected===date?'selected ':'')+(today?'today-mark ':'')+(forShifts&&sh?'shift '+sh.type:'')+'" onclick="chooseDate(\''+date+'\')">'+d.getDate()+(forShifts&&sh?'<i style="background:'+types[sh.type][2]+'"></i>':ev.length?'<i style="background:'+(ev.some(x=>x.kind==='work')?'#268aff':'#fa638e')+'"></i>':'')+'</button>'}return out+'</div></div>'}
function monthbar(){return '<div class="toolbar"><button class="round" onclick="moveMonth(-1)">‹</button><h2>'+new Date(year,month,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})+'</h2><button class="round" onclick="moveMonth(1)">›</button></div>'}
function moveMonth(n){let d=new Date(year,month+n,1);month=d.getMonth();year=d.getFullYear();render()}function chooseDate(d){selected=d;let a=d.split('-');year=+a[0];month=+a[1]-1;render()}
function calendar(){let today=localDate(new Date()),sh=shifts.find(x=>x.date===selected),count=events.filter(x=>x.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))).length;return '<div class="top"><div><div class="brand">Kalender</div><div class="subtitle">Alle Termine auf einen Blick</div></div><button class="add" onclick="openForm(\'event\')">+</button></div>'+monthbar()+'<div class="toolbar"><span class="muted">'+count+' Termine in diesem Monat</span><button class="textbtn" onclick="chooseDate(\''+today+'\')">Heute anzeigen</button></div>'+calGrid(false)+'<div class="sectionhead"><h2>'+fmt(selected)+'</h2><button onclick="openForm(\'event\')">+ Termin</button></div>'+(sh?'<div class="glass item" style="margin-bottom:8px"><span class="tag" style="background:'+types[sh.type][2]+'55">'+types[sh.type][0]+'</span><div class="details"><strong>'+types[sh.type][1]+'</strong><small>'+esc(sh.start||'')+(sh.end?' – '+esc(sh.end):'')+'</small></div><button class="textbtn" onclick="navigate(\'shifts\')">Dienstplan ›</button></div>':'')+eventList(selected)}
function taskPriority(x){return x.priority==='high'?'Hoch':x.priority==='low'?'Niedrig':'Normal'}
function taskList(a){let today=localDate(new Date());return a.length?a.map(x=>'<div class="glass item '+(x.done?'done':'')+'" style="border-left:3px solid '+(x.priority==='high'?'#f56c82':x.priority==='low'?'#38bf9a':'#458ff4')+'"><input aria-label="Aufgabe erledigen" class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggleTask(\''+esc(x.id)+'\')"><span class="iconbox">'+esc(x.icon||'📌')+'</span><div class="details"><strong>'+esc(x.title)+'</strong><small>'+(x.date?fmt(x.date):'Ohne Datum')+(x.date&&!x.done&&x.date<today?' · Überfällig':'')+' · '+taskPriority(x)+(x.details?' · '+esc(x.details):'')+'</small></div><button aria-label="Aufgabe bearbeiten" class="dots" onclick="openForm(\'task\',\''+esc(x.id)+'\')">•••</button></div>').join(''):'<div class="glass empty">Hier ist noch alles frei. ✨</div>'}
function tasksPage(){let today=localDate(new Date()),weekEnd=new Date(today+'T12:00:00');weekEnd.setDate(weekEnd.getDate()+7);let end=localDate(weekEnd),a=tasks.filter(x=>filter==='Erledigt'?x.done:filter==='Heute'?!x.done&&x.date===today:filter==='Diese Woche'?!x.done&&x.date&&x.date>=today&&x.date<end:filter==='Überfällig'?!x.done&&x.date&&x.date<today:!x.done);a.sort((x,y)=>((x.date||'9999').localeCompare(y.date||'9999'))||(({high:0,normal:1,low:2}[x.priority||'normal'])-({high:0,normal:1,low:2}[y.priority||'normal'])));let open=tasks.filter(x=>!x.done).length,overdue=tasks.filter(x=>!x.done&&x.date&&x.date<today).length;return '<div class="top"><div><div class="brand">Aufgaben</div><div class="subtitle">Organisiert durch den Tag</div></div><button class="add" onclick="openForm(\'task\')">+</button></div><div class="glass" style="padding:15px;display:flex;justify-content:space-around;text-align:center"><div><strong style="font-size:23px">'+open+'</strong><div class="muted">Offen</div></div><div><strong style="font-size:23px">'+overdue+'</strong><div class="muted">Überfällig</div></div><div><strong style="font-size:23px">'+tasks.filter(x=>x.done).length+'</strong><div class="muted">Erledigt</div></div></div><div class="pillrow">'+['Alle','Heute','Diese Woche','Überfällig','Erledigt'].map(x=>'<button class="pill '+(filter===x?'active':'')+'" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+taskList(a)}
function toggleTask(id){let t=tasks.find(x=>String(x.id)===String(id));if(t){t.done=!t.done;save(TK,tasks);render()}}
function shiftHours(x){if(!x.start||!x.end||!['early','late','night'].includes(x.type))return 0;let [a,b]=x.start.split(':').map(Number),[c,d]=x.end.split(':').map(Number);let mins=(c*60+d)-(a*60+b);if(mins<0)mins+=1440;return Math.max(0,(mins-(Number(x.breakMinutes)||0))/60)}
function shiftStats(){let prefix=year+'-'+String(month+1).padStart(2,'0'),arr=shifts.filter(x=>x.date.startsWith(prefix)),hours=arr.reduce((n,x)=>n+shiftHours(x),0);return '<div class="glass" style="padding:14px;margin:12px 0 17px"><div class="muted" style="margin-bottom:10px">Dein Monat im Überblick</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div><strong style="font-size:21px">'+arr.filter(x=>['early','late','night'].includes(x.type)).length+'</strong><div class="muted">Dienste</div></div><div><strong style="font-size:21px">'+hours.toLocaleString('de-DE',{maximumFractionDigits:1})+' h</strong><div class="muted">Arbeitszeit</div></div><div><strong style="font-size:21px">'+arr.filter(x=>x.type==='free'||x.type==='vacation').length+'</strong><div class="muted">Frei / Urlaub</div></div></div></div>'}
function shiftsPage(){let sh=shifts.find(x=>x.date===selected),prefix=year+'-'+String(month+1).padStart(2,'0'),monthShifts=shifts.filter(x=>x.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));return '<div class="top"><div><div class="brand">Dienstplan</div><div class="subtitle">Deine Schichten auf einen Blick</div></div><button class="add" aria-label="Schicht hinzufügen" onclick="openForm(\'shift\')">+</button></div>'+monthbar()+shiftStats()+'<div class="pillrow"><button class="pill '+(shiftMode==='Monat'?'active':'')+'" onclick="shiftMode=\'Monat\';render()">Monat</button><button class="pill '+(shiftMode==='Liste'?'active':'')+'" onclick="shiftMode=\'Liste\';render()">Liste</button></div>'+(shiftMode==='Monat'?calGrid(true):monthShifts.map(x=>'<button class="glass setting" onclick="openForm(\'shift\',\''+x.id+'\')"><span class="tag" style="background:'+types[x.type][2]+'55">'+types[x.type][0]+'</span><span>'+fmt(x.date)+' · '+types[x.type][1]+'<small class="muted" style="display:block">'+esc(x.start||'')+(x.end?' – '+esc(x.end):'')+(shiftHours(x)?' · '+shiftHours(x).toLocaleString('de-DE',{maximumFractionDigits:1})+' h':'')+'</small></span><span class="arrow">›</span></button>').join('')||'<div class="glass empty">Noch keine Schichten eingetragen.</div>')+'<div class="sectionhead"><h2>'+fmt(selected)+'</h2><button onclick="openForm(\'shift\',\''+(sh?sh.id:'')+'\')">'+(sh?'Bearbeiten':'+ Schicht')+'</button></div>'+(sh?'<div class="glass item"><span class="tag" style="background:'+types[sh.type][2]+'55">'+types[sh.type][0]+'</span><div class="details"><strong>'+types[sh.type][1]+'</strong><small>'+esc(sh.start||'')+(sh.end?' – '+esc(sh.end):'')+(shiftHours(sh)?' · '+shiftHours(sh).toLocaleString('de-DE',{maximumFractionDigits:1})+' h':'')+'</small></div></div>':'<div class="glass empty">Für diesen Tag ist keine Schicht eingetragen.</div>')+'<div class="glass" style="padding:14px;margin-top:15px"><strong>Schichtfarben</strong><div class="legend">'+Object.entries(types).map(([k,v])=>'<div><span class="tag" style="background:'+v[2]+'55">'+v[0]+'</span>'+v[1]+'</div>').join('')+'</div></div><p class="muted" style="padding:4px 8px">Arbeitszeit = Schichtdauer abzüglich Pause. Nachtdienste über Mitternacht werden berücksichtigt.</p>'}
let noteSearch='',noteFilter='Alle';
function noteLines(x){return String(x.body||'').split('\n')}
function notesPage(){let query=noteSearch.trim().toLocaleLowerCase('de'),list=notes.filter(x=>(!query||(String(x.title||'')+' '+String(x.body||'')).toLocaleLowerCase('de').includes(query))&&(noteFilter==='Alle'||(noteFilter==='Angeheftet'?x.pinned:noteFilter==='Checklisten'?x.checklist:false)));list.sort((x,y)=>Number(!!y.pinned)-Number(!!x.pinned)||String(y.updated||y.date||'').localeCompare(String(x.updated||x.date||'')));return '<div class="top"><div><div class="brand">Notizen</div><div class="subtitle">Deine Ideen an einem Ort</div></div><button class="add" onclick="openForm(\'note\')">+</button></div><label class="field" style="margin:0 0 12px"><input aria-label="Notizen durchsuchen" placeholder="⌕ Notizen durchsuchen" value="'+esc(noteSearch)+'" oninput="noteSearch=this.value;renderNotesResults()" style="margin:0"></label><div class="pillrow" id="noteFilters">'+['Alle','Angeheftet','Checklisten'].map(x=>'<button class="pill '+(noteFilter===x?'active':'')+'" onclick="noteFilter=\''+x+'\';render()">'+x+'</button>').join('')+'</div><div id="noteResults">'+noteCards(list)+'</div>'}
function noteCards(list){return '<div class="notes">'+list.map(x=>'<button class="glass note" style="border-top:3px solid '+({blue:'#398eff',violet:'#a080f3',pink:'#f47ea7',mint:'#45c8a5',amber:'#efbb57'}[x.color]||'#398eff')+'" onclick="openForm(\'note\',\''+esc(x.id)+'\')"><strong>'+(x.pinned?'📌 ':'')+esc(x.icon||'📝')+' '+esc(x.title||'Ohne Titel')+'</strong><p>'+(x.checklist?noteLines(x).slice(0,5).map(t=>'☐ '+esc(t)).join('\n'):esc(String(x.body||'').slice(0,140)))+'</p><small>'+esc(x.updated||x.date?fmt(x.updated||x.date):'')+'</small></button>').join('')+'</div>'+(list.length?'':'<div class="glass empty">Keine passenden Notizen gefunden. ✨</div>')}
function renderNotesResults(){let q=noteSearch.trim().toLocaleLowerCase('de'),list=notes.filter(x=>(!q||(String(x.title||'')+' '+String(x.body||'')).toLocaleLowerCase('de').includes(q))&&(noteFilter==='Alle'||(noteFilter==='Angeheftet'?x.pinned:x.checklist)));list.sort((x,y)=>Number(!!y.pinned)-Number(!!x.pinned)||String(y.updated||y.date||'').localeCompare(String(x.updated||x.date||'')));document.getElementById('noteResults').innerHTML=noteCards(list)}
function morePage(){return '<div class="top"><div class="brand">Einstellungen</div></div><button class="glass setting" onclick="alert(\'Yaryane – Dein persönlicher Kalender\')"><span>👤</span><span><strong>Yaryane</strong><small class="muted" style="display:block">Dein persönlicher Kalender</small></span><span class="arrow">›</span></button>'+[['▤','Notizen','notes'],['▦','Kalender','calendar'],['✓','Aufgaben','tasks'],['▣','Dienstplan','shifts']].map(([i,t,p])=>'<button class="glass setting" onclick="navigate(\''+p+'\')"><span>'+i+'</span><span>'+t+'</span><span class="arrow">›</span></button>').join('')+'<button class="glass setting" onclick="setTheme(theme===\'dark\'?\'light\':\'dark\');render()"><span>◐</span><span>Design</span><span class="muted">'+(theme==='dark'?'Dunkel':'Hell')+' ↔</span></button><button class="glass setting" onclick="exportData()"><span>⇩</span><span>Datensicherung exportieren</span><span class="arrow">›</span></button><label class="glass setting" style="cursor:pointer"><span>⇧</span><span>Datensicherung importieren</span><input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><div class="glass" style="padding:15px;margin-top:12px"><strong>☁ Synchronisierung & Sicherung</strong><p class="muted" style="line-height:1.5">Firebase-Projekt: yaryane. <strong id="firebaseConnection">Verbindung wird geprüft …</strong></p><p class="muted" style="line-height:1.5">Deine Daten bleiben vorerst lokal. Cloud-Synchronisierung wird erst nach Einrichtung der Anmeldung und sicheren Firestore-Regeln aktiviert.</p><p class="muted" id="backupStatus" style="line-height:1.5">Sicherung: <span id="backupStatusText">Noch keine Sicherung erstellt</span></p><button class="secondary" style="width:100%" onclick="exportData()">Jetzt Sicherung herunterladen</button><button class="secondary" style="width:100%;margin-top:8px" onclick="restoreSnapshot()">Letzten Import rückgängig machen</button><p class="muted" style="margin-bottom:0;line-height:1.5">Du kannst die Sicherungsdatei auf einem anderen Gerät importieren. Vor einem Import wird automatisch eine lokale Rückfallkopie angelegt.</p></div>'}
function render(){nav();document.getElementById('app').innerHTML=page==='home'?home():page==='calendar'?calendar():page==='tasks'?tasksPage():page==='shifts'?shiftsPage():page==='notes'?notesPage():morePage()}
function openForm(type,id){let arr=type==='event'?events:type==='task'?tasks:type==='shift'?shifts:notes,x=arr.find(v=>String(v.id)===String(id))||{},date=x.date||selected;edit={type,id:x.id};let fields=type==='event'?'<label class="field">Titel<input name="title" required value="'+esc(x.name)+'"></label><label class="field">Kategorie<select name="kind">'+[['private','Privat'],['work','Arbeit'],['free','Frei']].map(([k,v])=>'<option value="'+k+'" '+((x.kind||'private')===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">Datum<input type="date" name="date" required value="'+date+'"></label><label class="field">Beginn<input type="time" name="start" value="'+esc(x.start)+'"></label><label class="field">Ende<input type="time" name="end" value="'+esc(x.end)+'"></label><label class="field">Wiederholung<select name="repeat"><option value="1">Nur dieser Tag</option><option value="7">7 Tage hintereinander</option><option value="14">14 Tage hintereinander</option><option value="28">28 Tage hintereinander</option><option value="weekly4">Wöchentlich · 4 Wochen</option><option value="weekly8">Wöchentlich · 8 Wochen</option></select></label><label class="field">Notizen<textarea name="body">'+esc(x.notes)+'</textarea></label>':type==='task'?'<label class="field">Aufgabe<input name="title" required value="'+esc(x.title)+'"></label><label class="field">Symbol<select name="icon">'+['📌','💼','🛒','🏃','🎁','🏠','📋'].map(v=>'<option '+((x.icon||'📌')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">Fällig am<input type="date" name="date" value="'+esc(x.date)+'"></label><label class="field">Priorität<select name="priority"><option value="normal" '+((x.priority||'normal')==='normal'?'selected':'')+'>Normal</option><option value="high" '+(x.priority==='high'?'selected':'')+'>Hoch</option><option value="low" '+(x.priority==='low'?'selected':'')+'>Niedrig</option></select></label><label class="field">Beschreibung<textarea name="details">'+esc(x.details||'')+'</textarea></label>':type==='shift'?'<label class="field">Datum<input type="date" name="date" required value="'+date+'"></label><label class="field">Schicht<select name="shiftType">'+Object.entries(types).map(([k,v])=>'<option value="'+k+'" '+((x.type||'early')===k?'selected':'')+'>'+v[1]+'</option>').join('')+'</select></label><label class="field">Beginn<input type="time" name="start" value="'+esc(x.start)+'"></label><label class="field">Ende<input type="time" name="end" value="'+esc(x.end)+'"></label><label class="field">Pause (Minuten)<input type="number" name="breakMinutes" min="0" max="600" step="5" value="'+esc(x.breakMinutes||0)+'"></label>'+(id?'':'<label class="field">Wiederholung<select name="repeat"><option value="1">Einmalig</option><option value="7">7 Tage</option><option value="14">14 Tage</option><option value="28">28 Tage</option><option value="weekly4">Wöchentlich · 4 Wochen</option><option value="weekly8">Wöchentlich · 8 Wochen</option></select></label>'):'<label class="field">Titel<input name="title" required value="'+esc(x.title)+'"></label><label class="field">Symbol<select name="icon">'+['📝','💡','🛒','🎯','✈️','🍲','🔗','📚'].map(v=>'<option '+((x.icon||'📝')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">Inhalt<textarea name="body">'+esc(x.body)+'</textarea></label><label class="field">Farbe<select name="color">'+[['blue','Blau'],['violet','Violett'],['pink','Rosa'],['mint','Mint'],['amber','Gold']].map(([v,t])=>'<option value="'+v+'" '+((x.color||'blue')===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label class="field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="pinned" '+(x.pinned?'checked':'')+' style="width:auto;margin:0"> Notiz anheften</label><label class="field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="checklist" '+(x.checklist?'checked':'')+' style="width:auto;margin:0"> Als Checkliste anzeigen (eine Zeile je Punkt)</label>';document.getElementById('modal').innerHTML='<div class="overlay" onclick="closeForm()"><div class="sheet" onclick="event.stopPropagation()"><div class="toolbar"><h2>'+(id?'Bearbeiten':'Neu hinzufügen')+'</h2><button class="round" onclick="closeForm()">×</button></div><form onsubmit="submitForm(event)">'+fields+'<div class="formactions"><button type="button" class="secondary" onclick="closeForm()">Abbrechen</button><button class="primary" type="submit">Speichern</button></div>'+(id?'<button type="button" class="secondary danger" style="width:100%;margin-top:9px" onclick="deleteEntry()">Löschen</button>':'')+'</form></div></div>'}
function closeForm(){document.getElementById('modal').innerHTML='';edit=null}
function submitForm(e){e.preventDefault();let f=new FormData(e.target),id=edit.id||String(Date.now()),type=edit.type,arr=type==='event'?events:type==='task'?tasks:type==='shift'?shifts:notes,prev=arr.find(x=>x.id===id)||{},v=type==='event'?{id,kind:f.get('kind'),name:f.get('title'),date:f.get('date'),start:f.get('start'),end:f.get('end'),notes:f.get('body')}:type==='task'?{id,title:f.get('title'),icon:f.get('icon'),date:f.get('date'),priority:f.get('priority')||'normal',details:f.get('details')||'',done:prev.done||false}:type==='shift'?{id,date:f.get('date'),type:f.get('shiftType'),start:f.get('start'),end:f.get('end'),breakMinutes:Math.max(0,Number(f.get('breakMinutes'))||0)}:{id,title:f.get('title'),icon:f.get('icon'),body:f.get('body'),date:prev.date||localDate(new Date()),updated:localDate(new Date()),color:f.get('color')||'blue',pinned:f.has('pinned'),checklist:f.has('checklist')};if(type==='shift')arr=arr.filter(x=>x.date!==v.date||x.id===id);let ix=arr.findIndex(x=>x.id===id);if(ix>=0)arr[ix]=v;else arr.push(v);if(type==='shift'&&!edit.id){let rep=f.get('repeat')||'1',weekly=rep.startsWith('weekly'),count=weekly?Number(rep.slice(6)):Number(rep);if(count>1){for(let i=1;i<count;i++){let d=new Date(v.date+'T12:00:00');d.setDate(d.getDate()+i*(weekly?7:1));let date=localDate(d);if(!arr.some(x=>x.date===date))arr.push({...v,id:String(Date.now())+'-'+i,date})}}} if(type==='event'&&!edit.id){let rep=f.get('repeat')||'1',weekly=rep.startsWith('weekly'),count=weekly?Number(rep.slice(6)):Number(rep);if(count>1){for(let i=1;i<count;i++){let d=new Date(v.date+'T12:00:00');d.setDate(d.getDate()+i*(weekly?7:1));arr.push({...v,id:String(Date.now())+'-event-'+i,date:localDate(d)})}}} if(type==='event'){events=arr;save(K,arr)}if(type==='task'){tasks=arr;save(TK,arr)}if(type==='shift'){shifts=arr;save(SK,arr)}if(type==='note'){notes=arr;save(NK,arr)}closeForm();render()}
function deleteEntry(){if(!confirm('Diesen Eintrag wirklich löschen?'))return;let {type,id}=edit;if(type==='event')save(K,events=events.filter(x=>x.id!==id));if(type==='task')save(TK,tasks=tasks.filter(x=>x.id!==id));if(type==='shift')save(SK,shifts=shifts.filter(x=>x.id!==id));if(type==='note')save(NK,notes=notes.filter(x=>x.id!==id));closeForm();render()}
function backupPayload(){return {version:3,exportedAt:new Date().toISOString(),events,tasks,notes,shifts}}
function restoreSnapshot(){try{let v=JSON.parse(localStorage.getItem('yaryane_preimport_backup_v1')||'null');if(!v||!Array.isArray(v.events))return alert('Keine Rückfallkopie vorhanden.');if(!confirm('Vorherige Daten aus der Rückfallkopie wiederherstellen? Die aktuellen Daten werden überschrieben.'))return;save(K,events=v.events);save(TK,tasks=v.tasks||[]);save(NK,notes=v.notes||[]);save(SK,shifts=v.shifts||[]);render();alert('Rückfallkopie wiederhergestellt.')}catch(e){alert('Wiederherstellung fehlgeschlagen.')}} 
function exportData(){try{let data=JSON.stringify(backupPayload(),null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='yaryane-sicherung-'+localDate(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);localStorage.setItem('yaryane_last_export_v1',new Date().toISOString());alert('Sicherungsdatei wurde zum Download bereitgestellt. Bitte in Dateien speichern und aufbewahren.')}catch(e){alert('Sicherung konnte nicht erstellt werden: '+e.message)}}
function importData(input){let file=input.files[0];if(!file)return;if(file.size>10000000){alert('Datei zu groß.');input.value='';return}let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d||!Array.isArray(d.events))throw Error('Keine gültige Yaryane-Sicherung');for(let k of ['tasks','notes','shifts'])if(d[k]!==undefined&&!Array.isArray(d[k]))throw Error('Ungültiges Format: '+k);let counts='Termine: '+d.events.length+', Aufgaben: '+(d.tasks||[]).length+', Notizen: '+(d.notes||[]).length+', Schichten: '+(d.shifts||[]).length;if(!confirm('Sicherung importieren?\\n'+counts+'\\n\\nDie aktuellen Daten werden ersetzt. Vorher wird eine Rückfallkopie auf diesem Gerät angelegt.'))return;localStorage.setItem('yaryane_preimport_backup_v1',JSON.stringify(backupPayload()));save(K,events=d.events);save(TK,tasks=Array.isArray(d.tasks)?d.tasks:[]);save(NK,notes=Array.isArray(d.notes)?d.notes:[]);save(SK,shifts=Array.isArray(d.shifts)?d.shifts:[]);render();alert('Import abgeschlossen. Deine vorherigen Daten sind als lokale Rückfallkopie gespeichert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}finally{input.value=''}};reader.onerror=()=>{alert('Datei konnte nicht gelesen werden.');input.value=''};reader.readAsText(file)}

render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAc8nFeX52QlgO0Q3CQO36j6kXnb3dcnYE",authDomain:"yaryane.firebaseapp.com",projectId:"yaryane",storageBucket:"yaryane.firebasestorage.app",messagingSenderId:"251667285319",appId:"1:251667285319:web:c087369c2953cfb8a73862"};
try{
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=getFirestore(app);
  window.yaryaneFirebase={app,auth,db,ready:true,syncEnabled:false};
  const el=document.getElementById('firebaseConnection');
  if(el)el.textContent='Firebase vorbereitet · Synchronisierung noch nicht aktiviert';
}catch(error){
  console.error('Firebase initialization failed',error);
  window.yaryaneFirebase={ready:false,syncEnabled:false};
  const el=document.getElementById('firebaseConnection');if(el)el.textContent='Firebase konnte nicht initialisiert werden';
}
</script></body></html>
