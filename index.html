.profile-content{display:flex;align-items:center;gap:12px;padding:0 14px;margin-top:-22px;position:relative}
.profile-avatar{position:relative;flex:0 0 66px;width:66px;height:66px;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(140deg,#358ff5,#786bc9);display:grid;place-items:center;color:#fff;font-size:27px;font-weight:750;overflow:visible;cursor:pointer;box-shadow:0 3px 12px rgba(20,60,120,.16)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.profile-details{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;padding-top:22px}
.profile-details strong{font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.profile-details small{font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.profile-edit{width:auto;flex:0 0 auto;margin-top:20px;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:600;color:var(--accent);background:rgba(55,130,230,.12);box-shadow:none}
.profile-edit:active{opacity:.65}
.profile-hint{font-size:11px;color:var(--muted);padding:4px 15px 15px;margin:8px 0 0}
</style><style id="yaryane-profile-editor-fixes">
.profile-remove{display:block;margin:-13px 0 14px auto;padding:5px 12px;border:0;background:none;color:var(--muted);font-size:12px}
.profile-editor-overlay{position:fixed;inset:0;z-index:999;background:rgba(9,21,42,.5);display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(7px)}
.profile-editor{width:100%;max-width:390px;padding:24px;background:var(--bg)}
.profile-editor h3{margin:0 0 8px;font-size:21px}
.profile-editor p{font-size:13px;color:var(--muted);margin:0 0 22px}
.profile-editor label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}
.profile-editor input{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--glass);color:var(--ink)}
.profile-editor-actions{display:flex;gap:10px;margin-top:22px}

</style></head><body><div class="app" id="app"></div><nav class="nav" id="nav"></nav><div id="modal"></div><script>

function home(){let today=localDate(new Date());return '<div class="top"><div><div class="brand">🪷 Yary<span>ane</span> ✦</div><div class="subtitle">Dein Kalender. Dein Leben.</div></div><button class="avatar" onclick="navigate(\'more\')">●</button></div><section class="glass hero"><h1>Yaryane ☾</h1><p>Dein Kalender. Dein Leben.</p><button onclick="openForm(\'event\')">Neuen Termin hinzufügen… <b>+</b></button></section><div class="sectionhead"><h2>Heute</h2><button onclick="navigate(\'calendar\')">Alle anzeigen ›</button></div><div class="muted">'+fmt(today)+'</div>'+eventList(today)+'<div class="sectionhead"><h2>Deine Aufgaben</h2><button onclick="navigate(\'tasks\')">Alle anzeigen ›</button></div>'+taskList(tasks.filter(x=>!x.done).slice(0,3))+'<div class="sectionhead"><h2>Schnellzugriff</h2></div><div class="notes"><button class="glass note" onclick="navigate(\'shifts\')"><strong>▣ Dienstplan</strong><p>Deine Schichten im Blick</p></button><button class="glass note" onclick="navigate(\'notes\')"><strong>▤ Notizen</strong><p>Ideen und Listen festhalten</p></button></div>'}
function calGrid(forShifts){let first=new Date(year,month,1),offset=(first.getDay()+6)%7,last=new Date(year,month+1,0).getDate(),total=Math.ceil((offset+last)/7)*7,out='<div class="glass calendar"><div class="weekdays">'+days.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">';for(let i=0;i<total;i++){let d=new Date(year,month,i-offset+1),date=localDate(d),sh=shifts.find(x=>x.date===date),ev=events.filter(x=>x.date===date),other=d.getMonth()!==month,today=date===localDate(new Date());out+='<button aria-label="'+fmt(date)+(ev.length?', '+ev.length+' Termine':'')+'" class="day '+(other?'other ':'')+(selected===date?'selected ':'')+(today?'today-mark ':'')+(forShifts&&sh?'shift '+sh.type:'')+'" onclick="chooseDate(\''+date+'\')">'+d.getDate()+(forShifts&&sh?'<i style="background:'+types[sh.type][2]+'"></i>':ev.length?'<i style="background:'+(ev.some(x=>x.kind==='work')?'#268aff':'#fa638e')+'"></i>':'')+'</button>'}return out+'</div></div>'}

function tasksPage(){let today=localDate(new Date()),weekEnd=new Date(today+'T12:00:00');weekEnd.setDate(weekEnd.getDate()+7);let end=localDate(weekEnd),a=tasks.filter(x=>filter==='Erledigt'?x.done:filter==='Heute'?!x.done&&x.date===today:filter==='Diese Woche'?!x.done&&x.date&&x.date>=today&&x.date<end:filter==='Überfällig'?!x.done&&x.date&&x.date<today:!x.done);a.sort((x,y)=>((x.date||'9999').localeCompare(y.date||'9999'))||(({high:0,normal:1,low:2}[x.priority||'normal'])-({high:0,normal:1,low:2}[y.priority||'normal'])));let open=tasks.filter(x=>!x.done).length,overdue=tasks.filter(x=>!x.done&&x.date&&x.date<today).length;return '<div class="top"><div><div class="brand">Aufgaben</div><div class="subtitle">Organisiert durch den Tag</div></div><button class="add" onclick="openForm(\'task\')">+</button></div><div class="glass" style="padding:15px;display:flex;justify-content:space-around;text-align:center"><div><strong style="font-size:23px">'+open+'</strong><div class="muted">Offen</div></div><div><strong style="font-size:23px">'+overdue+'</strong><div class="muted">Überfällig</div></div><div><strong style="font-size:23px">'+tasks.filter(x=>x.done).length+'</strong><div class="muted">Erledigt</div></div></div><div class="pillrow">'+['Alle','Heute','Diese Woche','Überfällig','Erledigt'].map(x=>'<button class="pill '+(filter===x?'active':'')+'" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+taskList(a)}

ject.entries(types).map(([k,v])=>'<div><span class="tag" style="background:'+v[2]+'55">'+v[0]+'</span>'+v[1]+'</div>').join('')+'</div></div><p class="muted" style="padding:4px 8px">Arbeitszeit = Schichtdauer abzüglich Pause. Nachtdienste über Mitternacht werden berücksichtigt.</p>'}

const PROFILE_NAME_KEY='yaryane_profile_name_v1',PROFILE_PHOTO_KEY='yaryane_profile_photo_v1';
function editProfileName(){const current=localStorage.getItem(PROFILE_NAME_KEY)||'';const overlay=document.createElement('div');overlay.className='profile-editor-overlay';overlay.innerHTML='<form class="glass profile-editor" id="profileNameForm"><h3>Profil bearbeiten</h3><p>Wie möchtest du in Yaryane heißen?</p><label for="profileNameInput">Anzeigename</label><input id="profileNameInput" maxlength="45" autocomplete="nickname" placeholder="Dein Name"><div class="profile-editor-actions"><button type="button" class="secondary" id="profileCancel">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form>';document.body.appendChild(overlay);const input=overlay.querySelector('input');input.value=current;overlay.querySelector('#profileCancel').onclick=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.querySelector('form').onsubmit=e=>{e.preventDefault();const name=input.value.trim();if(name)localStorage.setItem(PROFILE_NAME_KEY,name);else localStorage.removeItem(PROFILE_NAME_KEY);overlay.remove();render();window.dispatchEvent(new Event('yaryane-local-change'))};input.focus()}

function updateProfilePhoto(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte ein Bild auswählen.');return}if(file.size>12000000){alert('Das Foto ist zu groß. Bitte ein kleineres Bild wählen.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas'),size=192;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size);localStorage.setItem(PROFILE_PHOTO_KEY,canvas.toDataURL('image/jpeg',.76));render();window.dispatchEvent(new Event('yaryane-local-change'))}catch(e){alert('Profilbild konnte nicht gespeichert werden.')}};img.onerror=()=>alert('Foto konnte nicht geöffnet werden.');img.src=reader.result};reader.readAsDataURL(file)}
