<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1020"><title>yaryane – Ohne Anmeldung</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f4f6ff;background:#080e1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#233258 0,transparent 38%),#080e1a}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8e87ff} .shell{max-width:1100px;margin:auto;padding:26px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:-1px;font-size:29px}.brand span{background:linear-gradient(90deg,#36e3df,#b67bff);color:transparent;background-clip:text}.muted{color:#9caac6}.small{font-size:13px}.pill,.nav button,.btn{border:1px solid #34415c;color:#f3f5ff;background:#172239;border-radius:13px;padding:11px 15px}.btn.primary{background:linear-gradient(120deg,#447bea,#7954ef);border:0;font-weight:700}.btn.danger{background:#5a2438}.nav{display:flex;gap:8px;overflow-x:auto;padding:22px 0}.nav button.active{background:#5046bd;border-color:#7970ff}.hero{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:10px 0 22px}h1{font-size:clamp(26px,4vw,39px);margin:0 0 8px}h2{font-size:19px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#121d30;border:1px solid #26354e;border-radius:22px;padding:20px}.stat{font-size:28px;font-weight:850;margin:12px 0 3px}.blue{color:#6aabff}.pink{color:#ff81b3}.green{color:#5ee4b3}.purple{color:#b7a0ff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0 14px}.seg{display:flex;gap:5px;padding:5px;background:#111b2e;border-radius:14px}.seg button{border:0;color:#aebad2;background:transparent;border-radius:10px;padding:9px 15px}.seg button.active{color:white;background:#4e51cc}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:118px;background:#111b2d;border:1px solid #293752;border-radius:12px;padding:9px;overflow:hidden}.day.today{border-color:#837bff}.day .num{font-size:14px;font-weight:700;margin-bottom:9px}.chip{border-radius:7px;padding:6px;margin:4px 0;font-size:11px;overflow-wrap:anywhere}.chip.work{background:#173c69;color:#a6d1ff}.chip.private{background:#512640;color:#ffb3d0}.chip.free{background:#164a3d;color:#a7f5d2}.weekhead{text-align:center;color:#a3b0c9;font-size:12px;padding:8px}.list{display:grid;gap:10px}.entry{display:flex;align-items:center;gap:13px;background:#17243b;padding:14px;border-radius:13px}.entry .bar{width:5px;align-self:stretch;border-radius:5px;background:#4a9bff}.entry.private .bar{background:#ee6c9f}.entry.free .bar{background:#4cd3a4}.entry .info{flex:1;min-width:0}.entry .info b{display:block}.entry .info small{color:#aab7d0}.entry button{background:transparent;color:#c7d1e6;border:0;font-size:19px}.empty{color:#9aaac5;padding:20px;text-align:center}.insight{background:linear-gradient(110deg,#123e49,#22264c);border:1px solid #376475;border-radius:17px;padding:19px}.insight p{color:#c5e5e7;line-height:1.6}.footer{position:fixed;bottom:0;left:0;right:0;background:#0d1728ee;backdrop-filter:blur(15px);border-top:1px solid #29344e;display:flex;justify-content:center;gap:6px;padding:9px}.footer button{border:0;background:transparent;color:#9baac6;padding:10px 14px;border-radius:12px}.footer button.active{color:white;background:#383a93}.modal{position:fixed;inset:0;background:#03070bd9;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.dialog{background:#142035;border:1px solid #405070;border-radius:22px;padding:24px;width:min(100%,480px);max-height:95vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;color:#b8c5df}.field input,.field select,.field textarea{background:#0b1525;border:1px solid #354461;border-radius:10px;color:white;padding:12px;min-width:0;width:100%}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.hidden{display:none!important}.notice{font-size:12px;color:#9eabc2;line-height:1.6}.section{margin-top:22px}.statrow{display:flex;justify-content:space-between;gap:8px}.help{line-height:1.7;color:#b6c3d9}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:span 2}.day{padding:5px;min-height:86px}.chip{font-size:9px;padding:4px}.footer{justify-content:space-around}.footer button{font-size:11px;padding:9px 6px}.shell{padding:18px 12px 100px}.card{padding:15px}}@media(max-width:370px){.calendar{gap:3px}.day{min-height:70px}.day .num{font-size:11px}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">LIFE<span>OS</span> ✦</div><div class="muted small">Dein Leben im Überblick</div></div><button class="btn primary" id="addTop">＋ Termin</button></header><nav class="nav" id="nav"><button data-page="home" class="active">⌂ Übersicht</button><button data-page="calendar">▦ Kalender</button><button data-page="shifts">▣ Dienstplan</button><button data-page="private">♡ Privat</button><button data-page="insights">✧ Smart Plan</button></nav><section class="hero"><div><h1 id="pageTitle">Hallo! 👋</h1><div class="muted" id="subtitle">Dein Tag. Dein Rhythmus. Deine Zeit.</div></div><div class="small muted" id="today"></div></section><div id="content"></div></main><footer class="footer" id="bottom"><button data-page="home" class="active">⌂ Home</button><button data-page="calendar">▦ Kalender</button><button data-page="shifts">▣ Dienste</button><button data-page="private">♡ Privat</button><button data-page="insights">✧ Smart</button></footer><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Termin hinzufügen</h2><form id="eventForm"><input type="hidden" id="eventId"><div class="field"><label for="kind">Bereich</label><select id="kind"><option value="work">Arbeit / Dienst</option><option value="private">Privat</option><option value="free">Frei / Erholung</option></select></div><div class="field"><label for="name">Bezeichnung</label><input id="name" placeholder="z. B. Frühdienst, Arzttermin" maxlength="100" required></div><div class="field"><label for="date">Datum</label><input id="date" type="date" required></div><div class="formgrid"><div class="field"><label for="start">Beginn</label><input id="start" type="time" required></div><div class="field"><label for="end">Ende</label><input id="end" type="time" required></div></div><div class="field"><label for="notes">Notiz (optional)</label><textarea id="notes" rows="2" maxlength="500"></textarea></div><div class="actions"><button type="button" class="btn" id="cancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form></div></div><script>
const key='yaryane_v1_events';const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const now=new Date();const today=iso(now);let events=[];try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))events=a}catch(e){}let page='home',filter='all',month=new Date(now.getFullYear(),now.getMonth(),1);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});const label={work:'Arbeit',private:'Privat',free:'Frei'};const sorted=()=>[...events].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const endDate=e=>{let d=new Date(e.date+'T'+e.end+':00');if(e.end<=e.start)d.setDate(d.getDate()+1);return d};const startDate=e=>new Date(e.date+'T'+e.start+':00');const duration=e=>(endDate(e)-startDate(e))/3600000;const overlaps=(a,b)=>startDate(a)<endDate(b)&&startDate(b)<endDate(a);const conflicts=()=>{let result=[];const a=sorted().filter(e=>e.kind!=='free');for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(overlaps(a[i],a[j]))result.push([a[i],a[j]]);return result};const weekStart=()=>{const d=new Date(now);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d};const weekEnd=()=>{const d=weekStart();d.setDate(d.getDate()+7);return d};const inWeek=e=>startDate(e)<weekEnd()&&endDate(e)>weekStart();const hours=()=>events.filter(e=>e.kind==='work'&&inWeek(e)).reduce((s,e)=>s+duration(e),0);const entry=e=>`<div class="entry ${e.kind}"><div class="bar"></div><div class="info"><b>${esc(e.name)}</b><small>${fmt(e.date)} · ${esc(e.start)}–${esc(e.end)} Uhr${e.end<=e.start?' (+1 Tag)':''} · ${label[e.kind]}</small>${e.notes?`<div class="small muted">${esc(e.notes)}</div>`:''}</div><button data-edit="${esc(e.id)}" title="Bearbeiten">✎</button><button data-delete="${esc(e.id)}" title="Löschen">×</button></div>`;const listing=a=>a.length?`<div class="list">${a.map(entry).join('')}</div>`:'<div class="empty">Noch keine Einträge. Füge deinen ersten Termin hinzu.</div>';const card=(title,value,detail,cls)=>`<div class="card"><div class="muted small">${title}</div><div class="stat ${cls}">${value}</div><div class="muted small">${detail}</div></div>`;function render(){const titles={home:['Hallo! 👋','Dein Tag. Dein Rhythmus. Deine Zeit.'],calendar:['Dein Kalender','Arbeit und Privat – zusammen oder getrennt.'],shifts:['Dein Dienstplan','Arbeitszeiten einfach verwalten.'],private:['Dein Privatleben','Deine persönliche Zeit bleibt im Blick.'],insights:['Smart Plan ✨','Dein intelligenter Planungsbegleiter.']};$('pageTitle').textContent=titles[page][0];$('subtitle').textContent=titles[page][1];$('today').textContent=now.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const work=events.filter(e=>e.kind==='work'&&inWeek(e));const priv=events.filter(e=>e.kind==='private'&&inWeek(e));const upcoming=sorted().filter(e=>endDate(e)>=new Date()).slice(0,6);if(page==='home')$('content').innerHTML=`<div class="grid">${card('Arbeitszeit diese Woche',hours().toLocaleString('de-DE',{maximumFractionDigits:1})+' h',work.length+' geplante Dienste','blue')}${card('Private Termine',priv.length,'in dieser Woche','pink')}${card('Terminkonflikte',conflicts().length,'überschneidende Einträge','green')}</div><div class="section insight"><b>✧ Dein Smart-Plan-Hinweis</b><p>${tip()}</p><button class="btn" data-page="insights">Smart Plan öffnen →</button></div><div class="section"><h2>Deine nächsten Termine</h2>${listing(upcoming)}</div>`;if(page==='calendar')renderCalendar();if(page==='shifts')$('content').innerHTML=`<div class="toolbar"><h2>Arbeits- und Dienstzeiten</h2><button class="btn primary" data-new="work">＋ Dienst eintragen</button></div><div class="grid">${card('Stunden diese Woche',hours().toFixed(1)+' h','Geplante Arbeitszeit','blue')}${card('Dienste diese Woche',work.length,'Arbeitsblöcke','purple')}${card('Alle Dienste',events.filter(e=>e.kind==='work').length,'In deinem Kalender','green')}</div><div class="section">${listing(sorted().filter(e=>e.kind==='work'))}</div>`;if(page==='private')$('content').innerHTML=`<div class="toolbar"><h2>Private Termine & freie Zeit</h2><button class="btn primary" data-new="private">＋ Privattermin</button></div>${listing(sorted().filter(e=>e.kind!=='work'))}`;if(page==='insights')renderInsights();}
function tip(){const c=conflicts();if(c.length)return `⚠️ ${c.length} mögliche Terminüberschneidung(en). Prüfe deine Planung im Smart Plan.`;const nights=events.filter(e=>e.kind==='work'&&e.end<=e.start&&inWeek(e));if(nights.length)return `🌙 Du hast ${nights.length} Nachtdienst(e) diese Woche. Plane ausreichend Ruhezeit ein.`;if(hours()>40)return '💙 Mehr als 40 Arbeitsstunden eingeplant. Achte auf deine Erholung.';return '🌿 Keine Terminkonflikte erkannt. Plane bewusst Zeit für dich ein.'}
function renderCalendar(){const year=month.getFullYear(),mon=month.getMonth(),first=(new Date(year,mon,1).getDay()+6)%7,days=new Date(year,mon+1,0).getDate();let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(s=>`<div class="weekhead">${s}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){const d=iso(new Date(year,mon,n)),items=sorted().filter(e=>e.date===d&&(filter==='all'||e.kind===filter));cells+=`<div class="day ${d===today?'today':''}"><div class="num">${n}</div>${items.map(e=>`<div class="chip ${e.kind}" title="${esc(e.start+' '+e.name)}">${esc(e.start)} ${esc(e.name)}</div>`).join('')}</div>`} $('content').innerHTML=`<div class="toolbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn" id="prevMonth">‹</button><b>${month.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn" id="nextMonth">›</button></div><button class="btn primary" data-new="private">＋ Hinzufügen</button></div><div class="seg" style="margin-bottom:16px;width:max-content"><button data-filter="all" class="${filter==='all'?'active':''}">Gesamt</button><button data-filter="work" class="${filter==='work'?'active':''}">Arbeit</button><button data-filter="private" class="${filter==='private'?'active':''}">Privat</button><button data-filter="free" class="${filter==='free'?'active':''}">Frei</button></div><div class="calendar">${cells}</div><div class="section"><h2>Einträge im Monat</h2>${listing(sorted().filter(e=>e.date.slice(0,7)===iso(month).slice(0,7)&&(filter==='all'||e.kind===filter)))}</div>`}
function renderInsights(){const c=conflicts();const nights=events.filter(e=>e.kind==='work'&&e.end<=e.start);const weekly=hours();$('content').innerHTML=`<div class="insight"><b>✧ Deine persönliche Auswertung</b><p>${tip()}</p></div><div class="section grid">${card('Arbeitszeit / Woche',weekly.toFixed(1)+' h','aus eingetragenen Diensten','blue')}${card('Nachtdienste gesamt',nights.length,'mit Ende am Folgetag','purple')}${card('Überschneidungen',c.length,'automatisch erkannt','pink')}</div><div class="section card"><h2>⚠️ Terminkonflikte</h2>${c.length?c.map(([a,b])=>`<p class="help">• ${esc(a.name)} (${fmt(a.date)}) überschneidet sich mit ${esc(b.name)} (${fmt(b.date)}).</p>`).join(''):'<p class="help">Keine Überschneidungen gefunden.</p>'}</div><div class="section card"><h2>🌿 Freizeit-Schutzschild</h2><p class="help">Berücksichtige nach langen oder nächtlichen Diensten ausreichend Erholung. yaryane zeigt dir deine Planung und macht dich auf mögliche Konflikte aufmerksam.</p><p class="notice">Dies ist eine regelbasierte Vorschau, kein KI-Dienst und keine medizinische oder arbeitsrechtliche Bewertung.</p></div><div class="section card"><h2>📁 Deine Daten</h2><p class="help">Deine Termine werden nur in diesem Browser gespeichert. Exportiere eine Sicherung, bevor du den Browser zurücksetzt oder das Gerät wechselst.</p><button class="btn" id="export">↓ JSON-Sicherung exportieren</button> <button class="btn" id="importBtn">↑ JSON-Sicherung importieren</button><input class="hidden" type="file" accept=".json,application/json" id="importFile"></div>`}
function openForm(kind='private',id=''){const e=events.find(e=>e.id===id);$('modalTitle').textContent=e?'Eintrag bearbeiten':'Neuen Eintrag erstellen';$('eventId').value=e?.id||'';$('kind').value=e?.kind||kind;$('name').value=e?.name||'';$('date').value=e?.date||today;$('start').value=e?.start||'09:00';$('end').value=e?.end||'10:00';$('notes').value=e?.notes||'';$('modal').classList.add('show');$('name').focus()}function closeForm(){$('modal').classList.remove('show')}function save(){try{localStorage.setItem(key,JSON.stringify(events))}catch(e){alert('Speichern nicht möglich. Prüfe den Browser-Speicher.')}render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.new)openForm(b.dataset.new);if(b.dataset.edit)openForm('private',b.dataset.edit);if(b.dataset.delete){if(confirm('Diesen Eintrag wirklich löschen?')){events=events.filter(x=>x.id!==b.dataset.delete);save()}}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.id==='prevMonth'){month.setMonth(month.getMonth()-1);render()}if(b.id==='nextMonth'){month.setMonth(month.getMonth()+1);render()}if(b.id==='export'){const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='lifeos-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(b.id==='importBtn')$('importFile').click()});$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x&&['work','private','free'].includes(x.kind)&&typeof x.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&/^\d{2}:\d{2}$/.test(x.start)&&/^\d{2}:\d{2}$/.test(x.end)))throw Error();if(confirm('Vorhandene Einträge durch die Sicherung ersetzen?')){events=data.map(x=>({...x,id:crypto.randomUUID()}));save()}}catch{alert('Ungültige Sicherungsdatei.')}e.target.value=''});$('addTop').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('eventForm').addEventListener('submit',e=>{e.preventDefault();const id=$('eventId').value||crypto.randomUUID();const entry={id,kind:$('kind').value,name:$('name').value.trim(),date:$('date').value,start:$('start').value,end:$('end').value,notes:$('notes').value.trim()};if(!entry.name)return;if(entry.start===entry.end){alert('Beginn und Ende dürfen nicht gleich sein.');return}const ix=events.findIndex(x=>x.id===id);if(ix>=0)events[ix]=entry;else events.push(entry);closeForm();save()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});render();
</script></body></html>
