const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>{localStorage.setItem(k,JSON.stringify(v));if([K,TK,NK,SK].includes(k))window.dispatchEvent(new Event('yaryane-local-change'))};

const yaneHistory=[];let yaneLastDraft=null,yaneLastSlots=[];
function yaneToday(){return localDate(new Date())}
function yaneFreeSlots(q){
 const now=new Date(),base=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
 const low=q.toLocaleLowerCase('de-DE');
 if(/übermorgen/.test(low))base.setDate(base.getDate()+2);else if(/morgen/.test(low))base.setDate(base.getDate()+1);
 const weekdays={sonntag:0,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6};
 const day=low.match(/(?:nächsten?|kommenden?)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)/);
 if(day){let offset=(weekdays[day[1]]-base.getDay()+7)%7;if(offset===0||/nächsten|kommenden/.test(day[0]))offset=offset||7;base.setDate(base.getDate()+offset)}
 const iso=low.match(/\b(\d{4})-(\d{2})-(\d{2})\b/),german=low.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/);
 if(iso||german){const y=Number(iso?iso[1]:german[3]),m=Number(iso?iso[2]:german[2]),d=Number(iso?iso[3]:german[1]);const test=new Date(y,m-1,d,12);if(test.getFullYear()!==y||test.getMonth()!==m-1||test.getDate()!==d)return 'Dieses Datum ist ungültig.';base.setTime(test.getTime())}
 const date=localDate(base),start=8*60,end=20*60,blocked=[],unknown=[];yaneLastSlots=[];
 const minutes=t=>{if(!/^\d{1,2}:\d{2}$/.test(String(t||'')))return null;const [h,m]=t.split(':').map(Number);return h<24&&m<60?h*60+m:null};
 for(const e of events.filter(x=>x.date===date)){const a=minutes(e.start),b=minutes(e.end);if(a===null||b===null){unknown.push(e.name||'Termin');continue}blocked.push([a,b<=a?1440:b])}
 for(const x of shifts.filter(x=>x.date===date)){if(['free','off','vacation','sick'].includes(x.type))continue;const a=minutes(x.start),b=minutes(x.end);if(a===null||b===null){unknown.push('Dienstplaneintrag');continue}blocked.push([a,b<=a?1440:b])}
 blocked.sort((a,b)=>a[0]-b[0]);
 const free=[];let cursor=start;
 for(const [a,b] of blocked){if(a>cursor&&a-cursor>=30)free.push([cursor,Math.min(a,end)]);cursor=Math.max(cursor,b);if(cursor>=end)break}
 if(end-cursor>=30)free.push([cursor,end]);
 const clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 const valid=free.filter(([a,b])=>b>a&&b-a>=30&&!(date===localDate(now)&&b<=now.getHours()*60+now.getMinutes()));
 const list=valid.slice(0,6).map(([a,b])=>'• '+clock(a)+'–'+clock(b)+' Uhr');
 if(!unknown.length)yaneLastSlots=valid.slice(0,4).map(([a,b])=>({date,start:clock(Math.max(a,date===localDate(now)?Math.ceil((now.getHours()*60+now.getMinutes())/15)*15:a)),end:clock(b)})).filter(x=>x.start<x.end);
 return 'Mögliche Zeitfenster · '+fmt(date)+' ✨\n\n'+(list.length?list.join('\n'):'Zwischen 08:00 und 20:00 Uhr ist kein freies Zeitfenster von mindestens 30 Minuten erkennbar.')+(unknown.length?'\n\n⚠️ '+unknown.length+' Eintrag/Einträge ohne vollständige Uhrzeiten – die Vorschläge können sich überschneiden.':'')+'\n\nNur anhand deiner eingetragenen Zeiten, keine Verfügbarkeitsgarantie.';
}
function yaneDaySuggestions(){
 const date=localDate(new Date()),now=new Date(),clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 const minutes=v=>{const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=+m[1],n=+m[2];return h<24&&n<60?h*60+n:null};
 const blocked=[],unknown=[];
 for(const e of events.filter(x=>x.date===date)){const a=minutes(e.start),b=minutes(e.end);if(a===null||b===null){unknown.push(e.name||'Termin');continue}blocked.push([a,b<=a?1440:b])}
 for(const x of shifts.filter(x=>x.date===date&&!['free','off','vacation','sick'].includes(x.type))){const a=minutes(x.start),b=minutes(x.end);if(a===null||b===null){unknown.push('Schicht');continue}blocked.push([a,b<=a?1440:b])}
 const start=Math.max(8*60,Math.ceil((now.getHours()*60+now.getMinutes())/15)*15),end=20*60;
 if(start>=end)return 'Für heute ist mein Planungszeitraum (08:00–20:00 Uhr) vorbei. Du kannst mich morgen erneut fragen.';
 blocked.sort((a,b)=>a[0]-b[0]);let cursor=start;const slots=[];
 for(const [a,b] of blocked){const stop=Math.min(a,end);if(stop-cursor>=30)slots.push([cursor,stop]);cursor=Math.max(cursor,b);if(cursor>=end)break}
 if(end-cursor>=30)slots.push([cursor,end]);
 const pending=tasks.filter(t=>!t.done&&(!t.date||t.date<=date)).sort((a,b)=>(a.priority==='high'?-1:0)-(b.priority==='high'?-1:0)||String(a.date||'9999').localeCompare(String(b.date||'9999')));
 let lines=['Deine Tagesideen ✨',''];
 if(pending.length)lines.push('Offene Aufgaben für heute oder früher:',...pending.slice(0,4).map(t=>'• '+(t.title||t.name||'Aufgabe')+(t.priority==='high'?' · hohe Priorität':'')),'');
 else lines.push('Keine offenen Aufgaben mit Fälligkeit bis heute gefunden.','');
 if(slots.length){lines.push('Mögliche Zeit zum Erledigen:');slots.slice(0,3).forEach(([a,b])=>lines.push('• '+clock(a)+'–'+clock(b)+' Uhr'));}else lines.push('Kein freies Zeitfenster ab 30 Minuten im Planungszeitraum erkannt.');
 if(unknown.length)lines.push('','⚠️ '+unknown.length+' Termin-/Schichteinträge ohne vollständige Uhrzeiten. Die Vorschläge können unvollständig sein.');
 lines.push('','Ich kenne keine Dauer deiner Aufgaben. Das sind unverbindliche Ideen, keine automatisch geplanten Termine.');
 return lines.join('\n');
}
function yaneReply(question){
 const q=String(question||'').toLocaleLowerCase('de-DE').trim(),today=yaneToday();
 const pending=tasks.filter(t=>!t.done),todayEvents=events.filter(e=>e.date===today).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
 const todayShifts=shifts.filter(x=>x.date===today);
 const shiftLabel=x=>({early:'Frühdienst',late:'Spätdienst',night:'Nachtdienst',free:'Frei',off:'Frei',vacation:'Urlaub',sick:'Krank'}[x.type]||x.label||x.name||x.type||'Schicht');
 const taskLabel=t=>t.title||t.name||t.text||'Aufgabe';
 const eventLine=e=>'• '+fmt(e.date)+' · '+(e.start||'Ganztägig')+' · '+(e.name||'Termin');
 if(/wochenplanung|wochenplan|aufgaben.*(woche|7 tage)|woche.*aufgaben/.test(q))return 'Wochenplanung ✨\n\nWähle unten eine offene Aufgabe und ihre Dauer. Ich suche passende Zeitfenster in den nächsten sieben Tagen. Ein Kalendereintrag entsteht erst nach deiner Bestätigung.';
 if(/tagesvorschl|tagesplan|tagesideen|aufgaben.*(einplan|heute)|was soll ich (heute )?(erledigen|machen)/.test(q))return yaneDaySuggestions();
 if(/frei(e|en|es)? (zeit|slot|fenster)|zeitfenster|wann (habe|hab|ist) (ich )?zeit|wann passt|lücke(n)? im kalender/.test(q))return yaneFreeSlots(q);
 if(/^(hi|hey|hallo|guten morgen|guten abend)[! .]*$/.test(q))return 'Hallo! ✨ Ich bin Yane. Ich kann deine Termine, Aufgaben und Schichten auswerten und dir Yaryane erklären.';
 if(/hilfe|wer bist|was kannst|was ist yane|ki\b/.test(q))return 'Ich bin Yane ✦ – dein lokaler Assistent. Ich kann deinen Tag, die nächsten Termine, offene Aufgaben und den Dienstplan zusammenfassen. Ich bin noch keine generative KI und ändere keine Daten.';
 if(/backup|sicher|cloud|sync|konto|anmeld/.test(q))return 'Deine Daten sichern ☁️\n\nÖffne „Mehr“ und suche die Backup- und Cloud-Einstellungen. Du kannst eine JSON-Sicherung erstellen. Die Cloud-Funktionen verwendest du nur nach Anmeldung und Aktivierung.';
 if(/notiz/.test(q))return 'Notizen 📝\n\nDu hast '+notes.length+' gespeicherte Notiz(en). Du findest sie unter „Mehr“ → „Notizen“.';
 if(/design|hell|dunkel|modus|einstellung|profil/.test(q))return 'Unter „Mehr“ findest du Darstellung und Profil. Dort kannst du den Modus, deinen Namen und dein Profilbild ändern.';
 if(/aufgabe|todo|to-do|erledigen/.test(q))return 'Offene Aufgaben ✓\n\n'+(pending.length?pending.slice(0,8).map(t=>'• '+taskLabel(t)+(t.date?' ('+fmt(t.date)+')':'')).join('\n'):'Keine offenen Aufgaben.')+(pending.length>8?'\n… und '+(pending.length-8)+' weitere.':'');
 if(/frei|dienst|schicht|früh|spät|nacht|urlaub/.test(q)){
   const monthKey=today.slice(0,7),monthShifts=shifts.filter(x=>String(x.date||'').startsWith(monthKey));
   const upcoming=shifts.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
   return 'Dein Dienstplan ▣\n\n'+monthShifts.length+' Einträge in diesem Monat.\n\nNächste Einträge:\n'+(upcoming.length?upcoming.map(x=>'• '+fmt(x.date)+' · '+shiftLabel(x)).join('\n'):'Keine kommenden Einträge.')+'\n\nNicht eingetragene Tage sind nicht automatisch freie Tage.';
 }
 if(/woche|nächste 7 tage|kommende 7 tage/.test(q)){
   const end=new Date(today+'T12:00:00');end.setDate(end.getDate()+7);const limit=localDate(end);
   const weekEvents=events.filter(e=>e.date>=today&&e.date<limit).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
   return 'Deine nächsten 7 Tage 📅\n\n'+(weekEvents.length?weekEvents.slice(0,10).map(eventLine).join('\n'):'Keine Termine eingetragen.')+'\n\n'+pending.filter(t=>t.date>=today&&t.date<limit).length+' offene Aufgaben mit Fälligkeit in diesem Zeitraum.';
 }
 if(/termin|kalender|morgen|nächste/.test(q)){
   const next=events.filter(e=>e.date>=today).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))).slice(0,7);
   return 'Deine nächsten Termine 📅\n\n'+(next.length?next.map(eventLine).join('\n'):'Keine kommenden Termine gefunden.');
 }
 if(/heute|tagesübersicht|tag geplant|was steht/.test(q))return 'Heute · '+fmt(today)+'\n\n📅 '+todayEvents.length+' Termin(e)'+(todayEvents.length?'\n'+todayEvents.slice(0,5).map(e=>'• '+(e.start||'Ganztägig')+' · '+(e.name||'Termin')).join('\n'):'')+'\n\n✓ '+pending.length+' offene Aufgabe(n) insgesamt\n▣ '+todayShifts.length+' Dienstplaneinträge heute'+(todayShifts.length?'\n'+todayShifts.map(x=>'• '+shiftLabel(x)).join('\n'):'');

}

function yaneDraft(q){
 const raw=String(q||'').trim(),lower=raw.toLocaleLowerCase('de-DE');
 const kind=/(termin|treffen|arzt|zahnarzt|besprechung)/i.test(lower)?'event':/(aufgabe|erledigen|todo|to-do|erinner mich|denk dran)/i.test(lower)?'task':null;
 if(!kind||!/(erstell|trag|hinzufüg|hinzufueg|notier|mach|plan|erinner|denk dran|füg)/i.test(lower))return null;
 const now=new Date(),date=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
 if(/übermorgen/i.test(raw))date.setDate(date.getDate()+2);else if(/morgen/i.test(raw))date.setDate(date.getDate()+1);else if(/nächste woche/i.test(raw))date.setDate(date.getDate()+7);
 const weekdays={sonntag:0,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6};
 const weekday=lower.match(/(?:nächsten?|kommenden?)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)/);
 if(weekday){let diff=(weekdays[weekday[1]]-date.getDay()+7)%7;if(diff===0||/nächsten|kommenden/.test(weekday[0]))diff=diff||7;date.setDate(date.getDate()+diff)}
 const iso=raw.match(/\b(\d{4})-(\d{2})-(\d{2})\b/),german=raw.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/);
 if(iso||german){const y=Number(iso?iso[1]:german[3]),m=Number(iso?iso[2]:german[2]),d=Number(iso?iso[3]:german[1]);const test=new Date(y,m-1,d,12);if(test.getFullYear()!==y||test.getMonth()!==m-1||test.getDate()!==d)return {error:'Das Datum ist ungültig. Bitte verwende zum Beispiel 05.11.2026.'};date.setTime(test.getTime())}
 const time=raw.match(/\b(?:um\s+)?(\d{1,2})(?::(\d{2}))?\s*uhr\b/i);
 if(time&&(Number(time[1])>23||Number(time[2]||0)>59))return {error:'Die Uhrzeit ist ungültig. Bitte verwende zum Beispiel 15:30 Uhr.'};
 let title=raw.replace(/^(bitte\s+)?(erstelle?|trage?|hinzufügen|füge?|notiere?|mache?|plane?|erinner mich|denk dran)\s*/i,'').replace(/^(mir\s+)?(einen?\s+)?(termin|eine\s+aufgabe|aufgabe|ein\s+treffen)\s*/i,'').replace(/\b(heute|morgen|übermorgen|nächste woche|nächsten?|kommenden?)\b/gi,'').replace(/\b(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/gi,'').replace(/\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}\.\d{1,2}\.\d{4}\b/g,'').replace(/\b(?:um\s+)?\d{1,2}(?::\d{2})?\s*uhr\b/gi,'').replace(/\s+/g,' ').trim().replace(/^(für|am|ein|eine|den)\s+/i,'').trim();
 if(!title)title=kind==='event'?'Neuer Termin':'Neue Aufgabe';
 return {kind,title,date:localDate(date),time:time?String(time[1]).padStart(2,'0')+':'+(time[2]||'00'):''};
}
function yaneDraftOpen(d){
 closeYane();openForm(d.kind);

 const title=form.querySelector('[name="title"]'),date=form.querySelector('[name="date"]'),start=form.querySelector('[name="start"]');
 if(title)title.value=d.title;if(date)date.value=d.date;if(start&&d.time)start.value=d.time;const end=form.querySelector('[name="end"]');if(end&&d.end)end.value=d.end;

 form.insertBefore(info,form.firstChild);
}

function yaneTaskPlanner(weekMode=false){
 const box=document.getElementById('yaneMessages');if(!box)return;
 const pending=tasks.filter(t=>!t.done).sort((a,b)=>(a.priority==='high'?-1:0)-(b.priority==='high'?-1:0)||String(a.date||'9999').localeCompare(String(b.date||'9999'))).slice(0,8);
 const wrap=document.createElement('div');wrap.className='yane-task-planner';
 const head=document.createElement('strong');head.textContent=weekMode?'Aufgabe in den nächsten 7 Tagen planen':'Aufgabe für heute einplanen';wrap.appendChild(head);
 if(!pending.length){const msg=document.createElement('p');msg.textContent='Du hast aktuell keine offenen Aufgaben.';wrap.appendChild(msg)}
 else{
 const select=document.createElement('select');select.setAttribute('aria-label','Aufgabe auswählen');
 pending.forEach(t=>{const option=document.createElement('option');option.value=String(t.id);option.textContent=t.title||t.name||'Aufgabe';select.appendChild(option)});
 const duration=document.createElement('select');duration.setAttribute('aria-label','Dauer auswählen');
 [[30,'30 Minuten'],[60,'60 Minuten'],[90,'90 Minuten'],[120,'2 Stunden']].forEach(([n,label])=>{const opt=document.createElement('option');opt.value=String(n);opt.textContent=label;duration.appendChild(opt)});
 const go=document.createElement('button');go.type='button';go.textContent='Freie Zeiten anzeigen';
 go.onclick=()=>{
 const task=pending.find(t=>String(t.id)===select.value);if(!task)return;
 const needed=Number(duration.value),available=[];
 const days=weekMode?7:1;
 for(let day=0;day<days;day++){
  const date=new Date();date.setHours(12,0,0,0);date.setDate(date.getDate()+day);
  const query='Freie Zeitfenster '+localDate(date);
  yaneFreeSlots(query);
  available.push(...yaneLastSlots.filter(x=>{const [h1,m1]=x.start.split(':').map(Number),[h2,m2]=x.end.split(':').map(Number);return (h2*60+m2)-(h1*60+m1)>=needed}).slice(0,2));
 }
 yaneLastSlots=[];
 const previous=wrap.querySelector('.yane-task-results');if(previous)previous.remove();
 const results=document.createElement('div');results.className='yane-task-results';
 if(weekMode){
  results.classList.add('yane-week-grid');
  const weekdays=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const daysSummary=[];
  for(let day=0;day<7;day++){
   const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+day);
   const iso=localDate(d),slots=available.filter(x=>x.date===iso);
   const card=document.createElement('div');card.className='yane-week-card';
   const status=slots.length>=2?'good':slots.length===1?'limited':'busy';card.classList.add('yane-week-'+status);
   const heading=document.createElement('div');heading.className='yane-week-day';heading.textContent=weekdays[d.getDay()]+' · '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
   card.appendChild(heading);
   const count=events.filter(e=>e.date===iso).length,shift=shifts.find(x=>x.date===iso);
   daysSummary.push({date:iso,label:weekdays[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.',slots:slots.length,events:count});
   const meta=document.createElement('small');meta.textContent=count+' Termin'+(count===1?'':'e')+(shift?' · Dienstplan':'');card.appendChild(meta);
   const state=document.createElement('span');state.className='yane-week-status';state.textContent=status==='good'?'● Gute Auswahl':status==='limited'?'● Wenig Auswahl':'● Kein passendes Zeitfenster';card.appendChild(state);
   if(!slots.length){const empty=document.createElement('span');empty.className='yane-week-empty';empty.textContent='Kein passendes Fenster';card.appendChild(empty)}
   slots.forEach(slot=>{
    const btn=document.createElement('button');btn.type='button';
    const [h,m]=slot.start.split(':').map(Number),finish=h*60+m+needed,end=String(Math.floor(finish/60)).padStart(2,'0')+':'+String(finish%60).padStart(2,'0');
    btn.textContent=slot.start+'–'+end;
    btn.onclick=()=>{yaneLastDraft={kind:'event',title:task.title||task.name||'Aufgabe erledigen',date:slot.date,time:slot.start,end};yaneDraftOpen(yaneLastDraft)};
    card.appendChild(btn);
   });
   results.appendChild(card);
  }
  const summary=document.createElement('div');summary.className='yane-week-summary';
  const suitable=daysSummary.filter(d=>d.slots>0).sort((a,b)=>b.slots-a.slots||a.events-b.events||a.date.localeCompare(b.date));
  const title=document.createElement('strong');title.textContent='✦ Deine Wochenübersicht';summary.appendChild(title);
  const text=document.createElement('p');text.textContent=suitable.length?'Am besten geeignet: '+suitable[0].label+' · '+suitable[0].slots+' passende Zeitfenster. Insgesamt '+suitable.length+' von 7 Tagen mit mindestens einem Vorschlag.':'Für die gewählte Dauer wurde in den nächsten sieben Tagen kein passendes Zeitfenster erkannt.';summary.appendChild(text);
  if(suitable.length){
   const bestDay=suitable[0],bestSlot=available.filter(x=>x.date===bestDay.date).sort((a,b)=>a.start.localeCompare(b.start))[0];
   if(bestSlot){const [h,m]=bestSlot.start.split(':').map(Number),finish=h*60+m+needed,end=String(Math.floor(finish/60)).padStart(2,'0')+':'+String(finish%60).padStart(2,'0');
    const recommended=document.createElement('button');recommended.type='button';recommended.className='yane-best-slot';recommended.textContent='✦ Vorschlag übernehmen · '+bestDay.label+' '+bestSlot.start+'–'+end;
    recommended.onclick=()=>{yaneLastDraft={kind:'event',title:task.title||task.name||'Aufgabe erledigen',date:bestSlot.date,time:bestSlot.start,end};yaneDraftOpen(yaneLastDraft)};
    summary.appendChild(recommended);
   }
  }
  const hint=document.createElement('small');hint.textContent='Die Einschätzung basiert auf deinen eingetragenen Uhrzeiten und der gewählten Aufgabendauer.';summary.appendChild(hint);
  results.insertBefore(summary,results.firstChild);
 }else if(!available.length){results.textContent='Kein passendes freies Zeitfenster gefunden. Versuche eine kürzere Dauer.'}
 else available.slice(0,3).forEach(slot=>{const btn=document.createElement('button');btn.type='button';const [h,m]=slot.start.split(':').map(Number),finish=h*60+m+needed,end=String(Math.floor(finish/60)).padStart(2,'0')+':'+String(finish%60).padStart(2,'0');btn.textContent=slot.start+'–'+end+' Uhr';btn.onclick=()=>{yaneLastDraft={kind:'event',title:task.title||task.name||'Aufgabe erledigen',date:slot.date,time:slot.start,end};yaneDraftOpen(yaneLastDraft)};results.appendChild(btn)});
 wrap.appendChild(results);
 };
 wrap.append(select,duration,go);
 }
 box.appendChild(wrap);box.scrollTop=box.scrollHeight;
}
function yaneSlotButtons(){
 const box=document.getElementById('yaneMessages');if(!box||!yaneLastSlots.length)return;
 const wrap=document.createElement('div');wrap.className='yane-slot-options';
 const label=document.createElement('small');label.textContent='Termin für ein Zeitfenster vorbereiten:';wrap.appendChild(label);
 yaneLastSlots.forEach(slot=>{const btn=document.createElement('button');btn.type='button';btn.textContent=slot.start+' – '+slot.end;btn.onclick=()=>{yaneLastDraft={kind:'event',title:'Neuer Termin',date:slot.date,time:slot.start,end:slot.end};yaneDraftOpen(yaneLastDraft)};wrap.appendChild(btn)});
 box.appendChild(wrap);box.scrollTop=box.scrollHeight;
}
function yaneAsk(q){q=String(q||'').trim().slice(0,350);if(!q)return;const isWeekPlanner=/wochenplanung|wochenplan|aufgaben.*(woche|7 tage)|woche.*aufgaben/i.test(q);const isPlanner=isWeekPlanner||/aufgabe(n)? (einplanen|planen)|aufgabenplanung|aufgabe in kalender/i.test(q);const isSlotQuestion=/frei(e|en|es)? (zeit|slot|fenster)|zeitfenster|wann (habe|hab|ist) (ich )?zeit|wann passt|lücke(n)? im kalender/i.test(q);if(!isSlotQuestion)yaneLastSlots=[];const draft=yaneDraft(q);yaneLastDraft=draft&&!draft.error?draft:null;yaneHistory.push({role:'user',text:q},{role:'bot',text:draft?(draft.error||'Ich habe einen Entwurf vorbereitet. Bitte prüfe die Angaben, bevor du ihn speicherst. ✨'):yaneReply(q)});if(yaneHistory.length>24)yaneHistory.splice(0,yaneHistory.length-24);yaneDraw();if(draft&&!draft.error)yaneDraftShow(draft);else if(isPlanner)yaneTaskPlanner(isWeekPlanner);else if(isSlotQuestion)yaneSlotButtons();const input=document.getElementById('yaneInput');if(input)input.value=''}
function yaneWelcome(){
 const now=new Date(),hour=now.getHours(),greeting=hour<11?'Guten Morgen':hour<18?'Guten Tag':'Guten Abend',today=localDate(now);
 const todays=events.filter(e=>e.date===today),active=tasks.filter(t=>!t.done),due=active.filter(t=>t.date&&t.date<=today),shift=shifts.find(x=>x.date===today);
 const shiftNames={early:'Frühdienst',late:'Spätdienst',night:'Nachtdienst',free:'Frei',off:'Frei',vacation:'Urlaub',sick:'Krank'};
 const panel=document.createElement('div');panel.className='yane-welcome';const profileName=(localStorage.getItem('yaryane_profile_name_v1')||'').trim().slice(0,40);
 const heading=document.createElement('div');heading.className='yane-welcome-heading';heading.textContent=greeting+(profileName?', '+profileName:'')+' ✨';
 const intro=document.createElement('p');intro.textContent='Hier ist dein Überblick für heute.';
 const stats=document.createElement('div');stats.className='yane-welcome-stats';
 [[String(todays.length),'Termine'],[String(active.length),'Offene Aufgaben'],[String(due.length),'Heute fällig']].forEach(([n,label])=>{const item=document.createElement('div');const strong=document.createElement('strong');strong.textContent=n;const small=document.createElement('small');small.textContent=label;item.append(strong,small);stats.appendChild(item)});
 panel.append(heading,intro,stats);
 const upcoming=events.filter(e=>e.date>=today).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start||'').localeCompare(String(b.start||''))).slice(0,3);
 if(upcoming.length){const section=document.createElement('div');section.className='yane-upcoming';const label=document.createElement('div');label.className='yane-upcoming-label';label.textContent='Als Nächstes';section.appendChild(label);upcoming.forEach(e=>{const item=document.createElement('div');item.className='yane-upcoming-item';const when=document.createElement('span');when.textContent=fmt(e.date)+(e.start?' · '+e.start:'');const title=document.createElement('strong');title.textContent=e.name||'Termin';item.append(when,title);section.appendChild(item)});panel.appendChild(section)}
 if(shift){const line=document.createElement('p');line.className='yane-welcome-shift';line.textContent='▣ Dienstplan: '+(shiftNames[shift.type]||shift.type||'Eintrag')+(shift.start?' · '+shift.start+(shift.end?'–'+shift.end:''):'');panel.appendChild(line)}
 const actions=document.createElement('div');actions.className='yane-welcome-actions';
 [['Tagesideen','Meine Tagesideen'],['Freie Zeit','Freie Zeitfenster heute'],['Aufgabe planen','Aufgabe einplanen'],['Wochenplan','Wochenplanung für Aufgaben']].forEach(([label,q])=>{const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.onclick=()=>yaneAsk(q);actions.appendChild(btn)});
 panel.appendChild(actions);return panel;

function openYane(){document.querySelectorAll('.event-detail-overlay').forEach(el=>el.remove());const overlay=document.getElementById('yaneOverlay');if(!overlay)return;if(!overlay.hidden)return;if(!yaneHistory.length)yaneHistory.push({role:'bot',text:'Ich bin Yane ✦ und helfe dir bei Terminen, Aufgaben und deinem Dienstplan. Was möchtest du wissen?'});overlay.hidden=false;overlay.style.display='flex';overlay.innerHTML='<section class="yane-panel" role="dialog" aria-modal="true" aria-label="Yane Assistent"><div class="yane-head"><div class="yane-logo">✦</div><div class="yane-head-copy"><strong>Yane</strong><small>Dein lokaler Yaryane-Assistent</small></div><button class="yane-x" type="button" aria-label="Schließen" onclick="closeYane()">×</button></div><div class="yane-messages" id="yaneMessages"></div><div class="yane-quick"><button onclick="yaneAsk(\'Was steht heute an?\')">Heute ✨</button><button onclick="yaneAsk(\'Meine Tagesideen\')">Tagesideen</button><button onclick="yaneAsk(\'Wochenplanung für Aufgaben\')">Wochenplan</button><button onclick="yaneAsk(\'Meine nächsten Termine\')">Termine</button><button onclick="yaneAsk(\'Meine Aufgaben\')">Aufgaben</button><button onclick="yaneAsk(\'Mein Dienstplan\')">Dienstplan</button><button onclick="yaneAsk(\'Freie Zeitfenster morgen\')">Freie Zeit</button><button onclick="yaneAsk(\'Wie sichere ich meine Daten?\')">App-Hilfe</button></div><form class="yane-compose" onsubmit="event.preventDefault();yaneAsk(document.getElementById(\'yaneInput\').value)"><input id="yaneInput" maxlength="350" placeholder="Frag Yane etwas …" autocomplete="off" aria-label="Nachricht an Yane"><button type="submit" aria-label="Senden">↑</button></form><div class="yane-foot">Lokal auf deinem Gerät · Noch keine externe KI</div></section>';overlay.onclick=e=>{if(e.target===overlay)closeYane()};yaneDraw();if(yaneHistory.length<=1){const messages=document.getElementById('yaneMessages');if(messages)messages.prepend(yaneWelcome())}if(yaneLastDraft)yaneDraftShow(yaneLastDraft);else if(yaneLastSlots.length)yaneSlotButtons()}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('yaneOverlay')&&!document.getElementById('yaneOverlay').hidden)closeYane();document.querySelectorAll('.event-detail-overlay').forEach(el=>el.remove())}});

function calGrid(forShifts){let first=new Date(year,month,1),offset=(first.getDay()+6)%7,last=new Date(year,month+1,0).getDate(),total=Math.ceil((offset+last)/7)*7,out='<div class="glass calendar"><div class="weekdays">'+days.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">';for(let i=0;i<total;i++){let d=new Date(year,month,i-offset+1),date=localDate(d),sh=shifts.find(x=>x.date===date),ev=events.filter(x=>x.date===date),other=d.getMonth()!==month,today=date===localDate(new Date());out+='<button aria-label="'+fmt(date)+(ev.length?', '+ev.length+' Termine':'')+'" class="day '+(other?'other ':'')+(selected===date?'selected ':'')+(today?'today-mark ':'')+(forShifts&&sh?'shift '+sh.type:'')+'" onclick="chooseDate(\''+date+'\')">'+d.getDate()+(forShifts&&sh?'<i style="background:'+types[sh.type][2]+'"></i>':ev.length?'<i style="background:'+(ev.some(x=>x.kind==='work')?'#268aff':'#fa638e')+'"></i>':'')+'</button>'}return out+'</div></div>'}

function tasksPage(){let today=localDate(new Date()),weekEnd=new Date(today+'T12:00:00');weekEnd.setDate(weekEnd.getDate()+7);let end=localDate(weekEnd),a=tasks.filter(x=>filter==='Erledigt'?x.done:filter==='Heute'?!x.done&&x.date===today:filter==='Diese Woche'?!x.done&&x.date&&x.date>=today&&x.date<end:filter==='Überfällig'?!x.done&&x.date&&x.date<today:!x.done);a.sort((x,y)=>((x.date||'9999').localeCompare(y.date||'9999'))||(({high:0,normal:1,low:2}[x.priority||'normal'])-({high:0,normal:1,low:2}[y.priority||'normal'])));let open=tasks.filter(x=>!x.done).length,overdue=tasks.filter(x=>!x.done&&x.date&&x.date<today).length;return '<div class="top"><div><div class="brand">Aufgaben</div><div class="subtitle">Organisiert durch den Tag</div></div><button class="add" onclick="openForm(\'task\')">+</button></div><div class="glass" style="padding:15px;display:flex;justify-content:space-around;text-align:center"><div><strong style="font-size:23px">'+open+'</strong><div class="muted">Offen</div></div><div><strong style="font-size:23px">'+overdue+'</strong><div class="muted">Überfällig</div></div><div><strong style="font-size:23px">'+tasks.filter(x=>x.done).length+'</strong><div class="muted">Erledigt</div></div></div><div class="pillrow">'+['Alle','Heute','Diese Woche','Überfällig','Erledigt'].map(x=>'<button class="pill '+(filter===x?'active':'')+'" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+taskList(a)}

function updateProfilePhoto(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte ein Bild auswählen.');return}if(file.size>12000000){alert('Das Foto ist zu groß. Bitte ein kleineres Bild wählen.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas'),size=192;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size);localStorage.setItem(PROFILE_PHOTO_KEY,canvas.toDataURL('image/jpeg',.76));render();window.dispatchEvent(new Event('yaryane-local-change'))}catch(e){alert('Profilbild konnte nicht gespeichert werden.')}};img.onerror=()=>alert('Foto konnte nicht geöffnet werden.');img.src=reader.result};reader.readAsDataURL(file)}

function yaryaneEventConflicts(candidate,excludeId){
 const toMinutes=v=>{const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=+m[1],n=+m[2];return h<24&&n<60?h*60+n:null};

}
